name: CI - Bad Release Candidate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r release_candidate_bad/requirements.txt
          pip install -r release_candidate_bad/requirements-dev.txt
      - name: Lint
        run: |
          cd release_candidate_bad
          ruff check .
      - name: Type check
        run: |
          cd release_candidate_bad
          mypy src tests
      - name: Run tests
        # FIX 14: missing PYTHONPATH=. so pytest couldn't resolve src imports
        run: |
          cd release_candidate_bad
          PYTHONPATH=. pytest -q
      - name: Smoke test pipeline
        run: |
          cd release_candidate_bad
          PYTHONPATH=. python -m src.bad_pipeline
