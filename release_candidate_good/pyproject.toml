[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "titanic-cicd-bad"
version = "0.1.0"
description = "Fixed release candidate for Titanic CI/CD demo"
requires-python = ">=3.10,<3.12"

# FIX 12: added pythonpath so pytest can resolve `from src.bad_pipeline import ...`
[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
